<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пример: Форма заявки</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: #eef2f7;
        color: #1a2332;
      }

      .form {
        box-sizing: border-box;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        padding: 24px;
        background: #ffffff;
        border: 1px solid #d0d7de;
        border-radius: 12px;
      }

      .form h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      .form-lead {
        margin: 0 0 20px;
        color: #5a667a;
        font-size: 15px;
      }

      fieldset {
        margin: 0 0 18px;
        padding: 16px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
      }

      legend {
        padding: 0 6px;
        font-weight: 700;
        color: #2965f1;
      }

      label {
        display: block;
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }

      .field {
        margin: 0 0 14px;
      }

      .field:last-child {
        margin-bottom: 0;
      }

      input[type='text'],
      input[type='email'],
      input[type='tel'],
      select,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        font: inherit;
        background: #fff;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      .choice {
        margin: 0 0 8px;
        font-weight: 500;
      }

      .choice input {
        margin-right: 8px;
      }

      .submit {
        width: 100%;
        margin-top: 4px;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #f06529;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <form class="form" action="#" method="post">
      <h1>Заявка на курс</h1>
      <p class="form-lead">Заполните форму — мы свяжемся с вами по почте или телефону.</p>

      <fieldset>
        <legend>Личные данные</legend>

        <div class="field">
          <label for="name">Имя</label>
          <input id="name" name="name" type="text" placeholder="Анна" required />
        </div>

        <div class="field">
          <label for="email">Электронная почта</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="anna@example.com"
            required
          />
        </div>

        <div class="field">
          <label for="phone">Телефон</label>
          <input id="phone" name="phone" type="tel" placeholder="+7 900 000-00-00" />
        </div>
      </fieldset>

      <fieldset>
        <legend>О курсе</legend>

        <div class="field">
          <label for="level">Уровень</label>
          <select id="level" name="level" required>
            <option value="">Выберите уровень</option>
            <option value="beginner">Новичок</option>
            <option value="middle">Уже пробовал HTML</option>
            <option value="advanced">Хочу углубить знания</option>
          </select>
        </div>

        <div class="field">
          <span class="choice-title">Формат обучения</span>
          <label class="choice">
            <input type="radio" name="format" value="online" checked />
            Онлайн
          </label>
          <label class="choice">
            <input type="radio" name="format" value="offline" />
            Очно
          </label>
        </div>

        <div class="field">
          <label class="choice">
            <input type="checkbox" name="newsletter" value="yes" />
            Хочу получать новости курса
          </label>
        </div>
      </fieldset>

      <div class="field">
        <label for="message">Комментарий</label>
        <textarea
          id="message"
          name="message"
          placeholder="Расскажите, чего хотите достичь"
        ></textarea>
      </div>

      <button class="submit" type="submit">Отправить заявку</button>
    </form>
  </body>
</html>
