<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пример: Шапка на Flexbox</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: #eef2f7;
        color: #1a2332;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 960px;
        margin: 24px auto;
        padding: 16px 24px;
        background: #ffffff;
        border: 1px solid #d0d7de;
        border-radius: 12px;
      }

      .logo {
        font-size: 20px;
        font-weight: 800;
        color: #f06529;
        text-decoration: none;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav a {
        color: #1a2332;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
      }

      .nav a:hover {
        color: #2965f1;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <a class="logo" href="#">Markup Lab</a>
      <ul class="nav">
        <li><a href="#">Задания</a></li>
        <li><a href="#">Квизы</a></li>
        <li><a href="#">Шпаргалки</a></li>
        <li><a href="#">Статьи</a></li>
      </ul>
    </header>
  </body>
</html>
