<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пример: Стилизация инпута</title>
    <style>
      body {
        margin: 0;
        padding: 32px 24px;
        font-family: system-ui, sans-serif;
        background: #eef2f7;
        color: #1a2332;
      }

      .panel {
        box-sizing: border-box;
        max-width: 420px;
        margin: 0 auto;
        padding: 28px;
        background: #ffffff;
        border: 1px solid #d0d7de;
        border-radius: 12px;
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .panel-lead {
        margin: 0 0 24px;
        color: #5a667a;
        font-size: 15px;
        line-height: 1.5;
      }

      .field {
        margin: 0 0 18px;
      }

      .field:last-child {
        margin-bottom: 0;
      }

      .field__label {
        display: block;
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
        color: #1a2332;
      }

      .field__input {
        box-sizing: border-box;
        display: block;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        background: #ffffff;
        color: #1a2332;
        font: inherit;
        font-size: 16px;
        outline: none;
      }

      .field__input::placeholder {
        color: #9aa6ba;
      }

      .field__input:focus {
        border-color: #2965f1;
        box-shadow: 0 0 0 3px rgba(41, 101, 241, 0.18);
      }

      .field__hint {
        margin: 8px 0 0;
        font-size: 13px;
        line-height: 1.4;
        color: #5a667a;
      }

      .field__error {
        margin: 8px 0 0;
        font-size: 13px;
        line-height: 1.4;
        color: #d4380d;
      }

      .field--error .field__label {
        color: #d4380d;
      }

      .field--error .field__input {
        border-color: #d4380d;
        background: #fff7f5;
      }

      .field--error .field__input:focus {
        border-color: #d4380d;
        box-shadow: 0 0 0 3px rgba(212, 56, 13, 0.16);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Вход в аккаунт</h1>
      <p class="panel-lead">Подпись сверху, под полем — подсказка или текст ошибки.</p>

      <div class="field">
        <label class="field__label" for="email">Электронная почта</label>
        <input
          class="field__input"
          id="email"
          name="email"
          type="email"
          placeholder="anna@example.com"
        />
        <p class="field__hint">Мы отправим письмо для подтверждения</p>
      </div>

      <div class="field field--error">
        <label class="field__label" for="password">Пароль</label>
        <input
          class="field__input"
          id="password"
          name="password"
          type="password"
          value="123"
          aria-invalid="true"
          aria-describedby="password-error"
        />
        <p class="field__error" id="password-error">Пароль слишком короткий — минимум 8 символов</p>
      </div>
    </div>
  </body>
</html>
