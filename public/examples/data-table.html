<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пример: Таблица</title>
    <style>
      body {
        margin: 0;
        padding: 32px 24px;
        font-family: system-ui, sans-serif;
        background: #eef2f7;
        color: #1a2332;
      }

      .panel {
        box-sizing: border-box;
        max-width: 640px;
        margin: 0 auto;
        padding: 28px;
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 12px;
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .panel-lead {
        margin: 0 0 20px;
        color: #5a667a;
        font-size: 15px;
        line-height: 1.5;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
      }

      .table caption {
        margin-bottom: 12px;
        text-align: left;
        font-weight: 700;
        font-size: 16px;
      }

      .table th,
      .table td {
        padding: 12px 14px;
        border-bottom: 1px solid #e4eaf3;
        text-align: left;
        font-size: 14px;
      }

      .table thead th {
        background: #2965f1;
        color: #fff;
        font-weight: 700;
        border-bottom: 0;
      }

      .table thead th:first-child {
        border-radius: 8px 0 0 0;
      }

      .table thead th:last-child {
        border-radius: 0 8px 0 0;
      }

      .table tbody tr:nth-child(even) {
        background: #f5f8fc;
      }

      .table .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Прогресс студентов</h1>
      <p class="panel-lead">Семантическая таблица: шапка, зебра и выравнивание чисел.</p>

      <table class="table">
        <caption>Результаты за неделю</caption>
        <thead>
          <tr>
            <th scope="col">Имя</th>
            <th scope="col">Задания</th>
            <th scope="col" class="num">Баллы</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Анна</td>
            <td>HTML-резюме</td>
            <td class="num">100</td>
          </tr>
          <tr>
            <td>Игорь</td>
            <td>Карточки товаров</td>
            <td class="num">90</td>
          </tr>
          <tr>
            <td>Мария</td>
            <td>Форма заявки</td>
            <td class="num">95</td>
          </tr>
          <tr>
            <td>Олег</td>
            <td>Стилизация текста</td>
            <td class="num">88</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
