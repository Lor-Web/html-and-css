<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пример: Кнопки и состояния</title>
    <style>
      body {
        margin: 0;
        padding: 32px 24px;
        font-family: system-ui, sans-serif;
        background: #eef2f7;
        color: #1a2332;
      }

      .panel {
        box-sizing: border-box;
        max-width: 480px;
        margin: 0 auto;
        padding: 28px;
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 12px;
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .panel-lead {
        margin: 0 0 24px;
        color: #5a667a;
        font-size: 15px;
        line-height: 1.5;
      }

      .row {
        margin: 0 0 16px;
      }

      .btn {
        display: inline-block;
        margin: 0 10px 10px 0;
        padding: 12px 18px;
        border-radius: 8px;
        border: 1px solid transparent;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .btn--primary {
        background: #f06529;
        color: #fff;
      }

      .btn--primary:hover {
        background: #d95520;
      }

      .btn--primary:active {
        background: #c24a1a;
      }

      .btn--secondary {
        background: #fff;
        color: #2965f1;
        border-color: #2965f1;
      }

      .btn--secondary:hover {
        background: #eef3ff;
      }

      .btn--secondary:active {
        background: #dce6ff;
      }

      .btn:disabled,
      .btn.is-disabled {
        background: #d0d7de;
        color: #8b95a8;
        border-color: #d0d7de;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Кнопки</h1>
      <p class="panel-lead">Primary, secondary и disabled. Наведите и нажмите — увидите состояния.</p>

      <div class="row">
        <button class="btn btn--primary" type="button">Сохранить</button>
        <button class="btn btn--secondary" type="button">Отмена</button>
      </div>

      <div class="row">
        <button class="btn btn--primary" type="button" disabled>Недоступно</button>
        <button class="btn btn--secondary is-disabled" type="button" disabled>Тоже недоступно</button>
      </div>
    </div>
  </body>
</html>
